{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit expense</h1>
            <p class="auth-subtitle">Editing expense from {{ expense.date|e }}</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error|e }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}" novalidate>
                {% include "_expense_form_fields.html" %}
            </form>
        </div>

    </div>
</section>

{% endblock %}
